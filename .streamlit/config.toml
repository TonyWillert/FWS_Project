# Die Person kann über das Streamlit-Menü zwischen hell und dunkel wechseln.
[theme]
base = "light"

[theme.light]
primaryColor = "#9B4933"
backgroundColor = "#FAF8F3"
secondaryBackgroundColor = "#EEECE5"
textColor = "#24332F"

[theme.dark]
primaryColor = "#9B4933"
backgroundColor = "#152321"
secondaryBackgroundColor = "#253531"
textColor = "#F4F0E8"
